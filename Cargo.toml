[package]
name = "gt"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.89", default-features = false, features = ["sha1", "max-performance-safe"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
strip = true
